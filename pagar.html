<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pagar cotización — ZYGOS</title>
<meta name="robots" content="noindex"/>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#F4F6FF;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px;
  }
  .card{
    background:#fff;border-radius:18px;padding:40px 34px;max-width:420px;width:100%;
    box-shadow:0 12px 44px rgba(20,30,80,.10);text-align:center;
  }
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;}
  .logo-brand{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:18px;color:#0D1228;letter-spacing:.5px;}
  .logo-sub{font-size:10px;color:#8992AC;letter-spacing:1px;text-transform:uppercase;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:19px;color:#0D1228;margin:0 0 6px;}
  .muted{color:#5E6E92;font-size:13px;margin:0 0 22px;}
  .quote-box{background:#F4F6FF;border-radius:12px;padding:18px;margin-bottom:22px;text-align:left;}
  .row{display:flex;justify-content:space-between;font-size:13px;color:#5E6E92;padding:4px 0;}
  .row b{color:#0D1228;}
  .total-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px dashed #D7DEF5;}
  .total-label{font-size:12px;color:#5E6E92;text-transform:uppercase;letter-spacing:1px;}
  .total-val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:800;color:#1847F0;}
  .pay-btn{
    width:100%;padding:15px;border:none;border-radius:10px;background:#1847F0;color:#fff;
    font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;cursor:pointer;
    transition:background .15s;
  }
  .pay-btn:hover{background:#1339c4;}
  .pay-btn:disabled{background:#A9B6E8;cursor:not-allowed;}
  .webpay-note{margin-top:14px;font-size:11px;color:#8992AC;}
  .state{padding:30px 0;}
  .state .icon{font-size:44px;margin-bottom:12px;}
  .error-msg{color:#DC2626;font-size:13px;margin-top:14px;display:none;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">
    <svg width="26" height="17" viewBox="0 0 30 19" fill="none"><path d="M 7 1 C 1 1 0 6 0 9.5 C 0 13 1 18 7 18" stroke="#0D1228" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M 23 1 C 29 1 30 6 30 9.5 C 30 13 29 18 23 18" stroke="#1847F0" stroke-width="2" fill="none" stroke-linecap="round"/><line x1="7" y1="9.5" x2="23" y2="9.5" stroke="#1847F0" stroke-width="1" stroke-dasharray="2.5 3.5"/><circle cx="15" cy="9.5" r="2.8" fill="#1847F0"/></svg>
    <div><div class="logo-brand">ZYGOS</div><div class="logo-sub">Access Control</div></div>
  </div>
  <div id="content">
    <div class="state"><div class="icon">⏳</div><p class="muted">Cargando cotización…</p></div>
  </div>
</div>

<form id="webpay-form" method="POST" style="display:none;">
  <input type="hidden" name="token_ws" id="webpay-token"/>
</form>

<script>
const SUPABASE_FN_URL = 'https://udubevpjygryycwipucs.supabase.co/functions/v1';
const params = new URLSearchParams(location.search);
const quoteId = params.get('id');
const content = document.getElementById('content');

function fmt(n){ try{ return Math.round(n).toLocaleString('es-CL'); }catch{ return '0'; } }

function renderError(msg){
  content.innerHTML = `<div class="state"><div class="icon">⚠️</div><h1>No pudimos cargar esto</h1><p class="muted">${msg}</p></div>`;
}

function renderPaid(nro){
  content.innerHTML = `<div class="state"><div class="icon">✅</div><h1>Cotización ${nro}</h1><p class="muted">Esta cotización ya fue pagada. Si tienes dudas, contáctanos.</p></div>`;
}

function renderQuote(q){
  content.innerHTML = `
    <h1>Pagar cotización</h1>
    <p class="muted">Pago seguro procesado por Webpay Plus (Transbank)</p>
    <div class="quote-box">
      <div class="row"><span>N° cotización</span><b>${q.nro}</b></div>
      ${q.cliente ? `<div class="row"><span>Cliente</span><b>${q.cliente}</b></div>` : ''}
      <div class="total-row">
        <span class="total-label">Total a pagar</span>
        <span class="total-val">$${fmt(q.total_clp)}</span>
      </div>
    </div>
    <button class="pay-btn" id="pay-btn" onclick="startPayment()">Pagar con Webpay →</button>
    <div class="error-msg" id="pay-error"></div>
    <div class="webpay-note">🔒 Tus datos de pago son procesados directamente por Transbank. ZYGOS no almacena tu tarjeta.</div>
  `;
}

async function loadQuote(){
  if(!quoteId){ renderError('Falta el identificador de la cotización en el link.'); return; }
  try{
    const res = await fetch(`${SUPABASE_FN_URL}/quote-info?id=${encodeURIComponent(quoteId)}`);
    const data = await res.json();
    if(!res.ok){ renderError(data.error || 'Cotización no encontrada.'); return; }
    if(data.pagada){ renderPaid(data.nro); return; }
    renderQuote(data);
  }catch(e){
    console.error(e);
    renderError('Ocurrió un problema de conexión. Intenta de nuevo en unos minutos.');
  }
}

async function startPayment(){
  const btn = document.getElementById('pay-btn');
  const errEl = document.getElementById('pay-error');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Redirigiendo a Webpay…';
  try{
    const res = await fetch(`${SUPABASE_FN_URL}/create-payment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ quote_id: quoteId }),
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.error || 'No se pudo iniciar el pago.'); }

    const form = document.getElementById('webpay-form');
    form.action = data.url;
    document.getElementById('webpay-token').value = data.token;
    form.submit();
  }catch(e){
    console.error(e);
    errEl.textContent = '⚠️ ' + e.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = 'Pagar con Webpay →';
  }
}

loadQuote();
</script>
</body>
</html>
